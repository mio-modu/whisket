<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>사택 관리 · 시연 샘플</title>
<style>
/* ── 팔레트 7토큰 ───────────────────────────────────────────── */
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --line:#E4E7EC; --line2:#CFD4DD;
  --ink:#0A0D14; --sub:#596273; --accent:#4338CA;
  --ok:#0F6B43; --warn:#8A5200; --bad:#B3261E;
  --onacc:#FFFFFF;
  --tint:rgba(67,56,202,.08);
  --okt:rgba(15,107,67,.10); --warnt:rgba(138,82,0,.10); --badt:rgba(179,38,30,.10);
  --glass:rgba(255,255,255,.72);
  /* 입체 — 앞뒤 그림자 세기를 다르게 */
  --e1:0 1px 2px rgba(10,13,20,.04),0 1px 3px rgba(10,13,20,.05);
  --e2:0 2px 6px -2px rgba(10,13,20,.06),0 8px 20px -6px rgba(10,13,20,.10);
  --e3:0 8px 16px -8px rgba(10,13,20,.14),0 32px 56px -16px rgba(10,13,20,.26);
  --sans:system-ui,-apple-system,"Segoe UI","Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0A0C10; --surface:#12151C; --line:#212631; --line2:#333A48;
    --ink:#EDF0F5; --sub:#99A2B2; --accent:#8B9CFF;
    --ok:#5FD9A0; --warn:#F0B45A; --bad:#FF8F85;
    --onacc:#0A0C10;
    --tint:rgba(139,156,255,.12);
    --okt:rgba(95,217,160,.12); --warnt:rgba(240,180,90,.12); --badt:rgba(255,143,133,.12);
    --glass:rgba(18,21,28,.72);
    --e1:0 1px 2px rgba(0,0,0,.4);
    --e2:0 2px 6px -2px rgba(0,0,0,.5),0 8px 20px -6px rgba(0,0,0,.55);
    --e3:0 8px 16px -8px rgba(0,0,0,.6),0 32px 56px -16px rgba(0,0,0,.72);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.65 var(--sans);word-break:keep-all;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,p,ul,ol,dl,dd,dt,figure{margin:0}
h1,h2,h3{letter-spacing:-.035em;line-height:1.16;font-weight:700}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.skip{position:absolute;left:-9999px;top:0;background:var(--ink);color:var(--bg);padding:10px 14px;z-index:60}
.skip:focus{left:10px;top:10px}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--accent);background:var(--tint);
  padding:5px 11px;border-radius:999px}
.lead{color:var(--sub);font-size:16.5px;max-width:34em}
.small{font-size:13px;color:var(--sub)}

/* ── 머리 ──────────────────────────────────────────────────── */
header{position:sticky;top:0;z-index:50;background:var(--glass);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;min-height:62px;flex-wrap:wrap;padding:9px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;
  letter-spacing:-.025em;text-decoration:none;white-space:nowrap}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--accent);
  display:grid;place-items:center;box-shadow:var(--e1);flex:none}
.brand i svg{width:15px;height:15px;stroke:var(--onacc);fill:none;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round}
.brand span{color:var(--sub);font-weight:500}
.sp{flex:1 1 auto}
.roles{display:flex;gap:3px;flex-wrap:wrap;background:var(--bg);padding:4px;
  border-radius:999px;border:1px solid var(--line)}
.roles button{background:none;border:0;border-radius:999px;color:var(--sub);
  padding:6px 13px;font-size:13px;font-weight:600;letter-spacing:-.01em;transition:.18s}
.roles button:hover{color:var(--ink)}
.roles button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--e1)}

/* ── 버튼 ──────────────────────────────────────────────────── */
.btn{background:var(--accent);color:var(--onacc);border:1px solid transparent;border-radius:10px;
  padding:9px 17px;font-size:14px;font-weight:600;letter-spacing:-.01em;
  box-shadow:var(--e1);transition:transform .16s,box-shadow .16s,filter .16s}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px);box-shadow:var(--e2)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none;box-shadow:none;filter:none}
.btn.g{background:var(--surface);color:var(--ink);border-color:var(--line2)}
.btn.g:hover{border-color:var(--sub);filter:none}
.btn.ok{background:var(--ok)}
.btn.no{background:var(--surface);color:var(--bad);border-color:var(--bad)}
.btn.no:hover{background:var(--bad);color:var(--onacc);filter:none}
.btn.lg{padding:13px 24px;font-size:15.5px;border-radius:12px}
.btn.sm{padding:6px 13px;font-size:13px;border-radius:9px}
.cta{display:flex;gap:11px;flex-wrap:wrap;margin-top:28px}

/* ── 판 ────────────────────────────────────────────────────── */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--e1);padding:22px}
.panel.up{box-shadow:var(--e2)}
.panel h2{font-size:17.5px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel>*+*{margin-top:14px}
.panel h2+p{margin-top:7px}

/* ── 히어로 ────────────────────────────────────────────────── */
.hero{padding:64px 0 54px;display:grid;grid-template-columns:1fr 1fr;gap:0 48px;align-items:center}
.hero h1{font-size:clamp(30px,4.5vw,46px);margin:20px 0 18px;max-width:14em}
.hero h1 em{font-style:normal;color:var(--accent)}

/* 화면 세 장을 계단처럼 — 앞뒤 그림자 세기를 다르게 */
.stack{position:relative;height:400px}
.scr{position:absolute;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;overflow:hidden;width:92%}
.scr.back {top:0;    left:8%; box-shadow:var(--e1); opacity:.6;  transform:scale(.93)}
.scr.mid  {top:116px;left:4%; box-shadow:var(--e2); opacity:.85; transform:scale(.965)}
.scr.front{top:232px;left:0;  box-shadow:var(--e3)}
.scr .tt{display:flex;align-items:center;gap:7px;padding:9px 13px;border-bottom:1px solid var(--line);
  background:var(--bg)}
.scr .tt b{font-size:11.5px;font-weight:700;letter-spacing:-.01em}
.scr .tt u{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--sub);
  text-decoration:none;letter-spacing:.04em}
.scr .rw{display:flex;align-items:center;gap:9px;padding:9px 13px;border-bottom:1px solid var(--line);
  font-size:11.5px;white-space:nowrap}
.scr .rw:last-child{border-bottom:0}
.scr .rw i{font-family:var(--mono);font-size:10px;color:var(--sub);font-style:normal;flex:none}
.scr .rw em{font-style:normal;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.scr .rw b{margin-left:auto;font-size:10.5px;font-weight:700;flex:none}
.dot{display:inline-flex;align-items:center;gap:5px}
.dot:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}

/* ── 구역 ──────────────────────────────────────────────────── */
.sec{padding:42px 0}
.sec>h2{font-size:27px;letter-spacing:-.04em}
.sec>h2+p{margin-top:10px;margin-bottom:26px;color:var(--sub);max-width:40em}
.steps{display:grid;gap:12px;counter-reset:s;padding:0;margin:0}
.steps li{list-style:none;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--e1);padding:17px 19px;
  display:grid;grid-template-columns:30px 1fr auto;gap:0 15px;align-items:center;transition:.18s}
.steps li:hover{box-shadow:var(--e2);transform:translateY(-1px)}
.steps li:before{counter-increment:s;content:counter(s,decimal-leading-zero);
  font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:700}
.steps b{display:block;font-size:15px;letter-spacing:-.02em}
.steps span{font-size:13px;color:var(--sub)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.three>div{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--e1);padding:20px}
.three h3{font-size:15.5px;margin-bottom:7px}
.three p{font-size:13.5px;color:var(--sub)}
.ic{width:36px;height:36px;border-radius:10px;background:var(--tint);display:grid;
  place-items:center;margin-bottom:13px}
.ic svg{width:19px;height:19px;stroke:var(--accent);fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.figs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.figs>div{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--e1);padding:18px}
.figs b{display:block;font-family:var(--mono);font-size:30px;font-weight:700;
  letter-spacing:-.04em;color:var(--accent);line-height:1.15}
.figs span{font-size:12.5px;color:var(--sub);display:block;margin-top:4px}

/* 수치 판 */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.vis{display:grid;gap:0}
.vis>div{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.vis>div:first-child{border-top:0}
.vis b{font-weight:700;min-width:5.6em;flex:none}
.vis span{color:var(--sub);font-size:13px;margin-left:auto;text-align:right}
.readout dl{display:grid;grid-template-columns:1fr auto;margin:0}
.readout dt,.readout dd{padding:10px 0;border-top:1px solid var(--line);font-size:14px;margin:0}
.readout dt{color:var(--sub)}
.readout dd{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.readout dd.over{color:var(--warn)}
.verdict{display:flex;gap:9px;align-items:flex-start;margin-top:14px;padding:12px 14px;
  border-radius:10px;background:var(--warnt);color:var(--warn);font-size:13.5px;font-weight:600}
.verdict svg{width:17px;height:17px;flex:none;margin-top:2px;stroke:currentColor;fill:none;stroke-width:1.9}

/* ── 업무 화면 ────────────────────────────────────────────── */
main{display:block;padding:30px 0 80px}
.ttl{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.ttl h1{font-size:26px}
.ttl .who{font-size:13px;color:var(--sub);font-family:var(--mono);margin-left:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 13px}
.blk{margin-bottom:16px}

table{width:100%;border-collapse:collapse;font-size:14px}
thead th{font-size:11px;letter-spacing:.07em;color:var(--sub);text-transform:uppercase;
  font-weight:700;text-align:left;padding:0 12px 10px 0;border-bottom:1px solid var(--line2);white-space:nowrap}
tbody td{padding:13px 12px 13px 0;border-bottom:1px solid var(--line);vertical-align:middle;
  overflow-wrap:anywhere}
tbody tr:last-child td{border-bottom:0}
thead th:last-child,tbody td:last-child{padding-right:0}
td.num,th.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
td.id{font-family:var(--mono);font-size:13px;color:var(--sub)}
tbody tr.flash{animation:fl .55s cubic-bezier(.2,.7,.3,1)}
@keyframes fl{0%{background:var(--tint)}70%{background:var(--tint)}100%{background:transparent}}

/* 상태 — 은은한 칩 */
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;
  font-size:12.5px;font-weight:700;white-space:nowrap}
.tag:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.t-ok{color:var(--ok);background:var(--okt)}
.t-w{color:var(--warn);background:var(--warnt)}
.t-b{color:var(--bad);background:var(--badt)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;white-space:nowrap}
.st svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;flex:none}
.st.lock{color:var(--warn)}.st.open{color:var(--ok)}
.mark{font-family:var(--mono);font-size:10.5px;font-weight:700;white-space:nowrap;
  padding:3px 8px;border-radius:999px}
.mark.o{color:var(--ok);background:var(--okt)}
.mark.b{color:var(--bad);background:var(--badt)}

.pg{display:inline-flex;align-items:center;vertical-align:middle}
.pg i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line2);
  background:var(--surface);flex:none}
.pg u{width:16px;height:1.5px;background:var(--line2);text-decoration:none}
.pg i.d{background:var(--ok);border-color:var(--ok)}
.pg u.d{background:var(--ok)}
.pg i.c{background:var(--warn);border-color:var(--warn)}
.pg i.x{background:var(--bad);border-color:var(--bad)}

.form{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label{font-size:11px;letter-spacing:.07em;color:var(--sub);text-transform:uppercase;font-weight:700}
.fld input,.fld select{background:var(--bg);border:1px solid var(--line2);border-radius:10px;
  padding:9px 12px;font-size:14.5px;max-width:100%;transition:.16s}
.fld select{appearance:none;padding-right:30px;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),
                   linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:right 14px center,right 9px center;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.fld input:focus,.fld select:focus{border-color:var(--accent);outline:0;box-shadow:0 0 0 3px var(--tint)}

/* 어드민 */
.admin{display:grid;grid-template-columns:244px 1fr;gap:0 26px;align-items:start}
.menu{list-style:none;padding:0;margin:0;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--e1);overflow:hidden}
.menu li+li{border-top:1px solid var(--line)}
.menu button{width:100%;text-align:left;background:none;border:0;padding:11px 15px;font-size:13.5px;
  display:flex;align-items:center;gap:10px;color:var(--sub);border-left:2px solid transparent}
.menu button:hover{color:var(--ink);background:var(--bg)}
.menu button[aria-current="true"]{color:var(--ink);font-weight:700;border-left-color:var(--accent);
  background:var(--tint)}
.menu .soon{opacity:.66}
.menu em{margin-left:auto;font-family:var(--mono);font-size:9.5px;font-style:normal;
  letter-spacing:.02em;color:var(--sub);white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpis>div{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--e1);padding:16px}
.kpis b{display:block;font-family:var(--mono);font-size:29px;font-weight:700;
  letter-spacing:-.04em;line-height:1.2}
.kpis span{font-size:12.5px;color:var(--sub)}

.notice{max-width:36em;padding:34px 0 10px}
.notice .code{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.12em;
  color:var(--sub);background:var(--surface);border:1px solid var(--line);
  padding:5px 11px;border-radius:999px}
.notice h2{font-size:25px;margin:14px 0 12px}

#toast{position:fixed;left:22px;right:22px;bottom:22px;max-width:520px;
  background:var(--ink);color:var(--bg);padding:14px 17px;font-size:14px;font-weight:600;
  border-radius:12px;box-shadow:var(--e3);opacity:0;transform:translateY(10px);
  transition:opacity .22s,transform .22s;pointer-events:none;z-index:55}
#toast.on{opacity:1;transform:translateY(0)}
footer{border-top:1px solid var(--line);padding:24px 0 48px;font-size:13px;color:var(--sub)}
footer p+p{margin-top:6px}

/* ── 좁은 폭 ──────────────────────────────────────────────── */
@media (max-width:900px){
  .hero{grid-template-columns:1fr;gap:38px;padding:44px 0 40px}
  .stack{height:390px;max-width:430px}
  .three{grid-template-columns:1fr}
  .duo{grid-template-columns:1fr}
  .figs{grid-template-columns:1fr 1fr}
  .admin{grid-template-columns:1fr;gap:20px}
  .kpis{grid-template-columns:1fr 1fr}
}
@media (max-width:640px){
  body{font-size:15px}
  .wrap{padding:0 16px}
  .bar .sp{display:none}
  .bar #reset{order:1;margin-left:auto}
  .roles{order:2;flex-basis:100%;justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap;
    scrollbar-width:none}
  .roles::-webkit-scrollbar{display:none}
  .ttl .who{margin-left:0;flex-basis:100%}
  .stack{height:auto;max-width:none}
  .scr{position:static;width:100%;transform:none;opacity:1;margin-bottom:12px}
  .scr.back{box-shadow:var(--e1)}
  .scr.mid{box-shadow:var(--e2)}
  .panel{padding:18px}
  table{display:block}
  thead{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
  tbody,tbody tr,tbody td{display:block;width:100%}
  tbody tr{border-top:1px solid var(--line);padding:13px 0 15px}
  tbody tr:first-child{border-top:0}
  tbody td{border:0;padding:3px 0;display:grid;grid-template-columns:84px minmax(0,1fr);
    gap:12px;align-items:baseline}
  tbody td:before{content:attr(data-label);font-size:10px;letter-spacing:.05em;
    text-transform:uppercase;color:var(--sub);font-weight:700;padding-top:4px}
  tbody td.num{text-align:left}
  tbody td.act{margin-top:9px}
  tbody td.act:before{content:""}
  tbody td.blank{display:none}
  .cv{display:block}
  .steps li{grid-template-columns:26px 1fr;gap:0 12px}
  .steps .btn{grid-column:2;justify-self:start;margin-top:11px}
  .fld{flex:1 1 100%}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpis>div{padding:13px}
  .kpis b{font-size:25px}
  .figs{grid-template-columns:1fr 1fr}
  /* 어드민 13개 메뉴는 가로 탭으로 */
  .admin{min-width:0}
  .admin>nav{min-width:0;max-width:100%;overflow:hidden;border-radius:12px}
  .menu{display:flex;overflow-x:auto;scrollbar-width:none;border-radius:12px;max-width:100%}
  .menu::-webkit-scrollbar{display:none}
  .menu li{flex:0 0 auto}
  .menu li+li{border-top:0;border-left:1px solid var(--line)}
  .menu button{white-space:nowrap;padding:11px 15px;border-left:0;
    border-bottom:2px solid transparent;background:none}
  .menu button[aria-current="true"]{border-left-color:transparent;border-bottom-color:var(--accent)}
  .ttl .who{background:none;border:0;padding:0}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<a class="skip" href="#main">본문으로 건너가기</a>
<header>
  <div class="wrap bar">
    <a class="brand" href="#/"><i><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg></i>사택 관리 <span>· 시연 샘플</span></a>
    <span class="sp"></span>
    <div class="roles" id="roles" role="group" aria-label="시연 역할 전환"></div>
    <button class="btn g sm" id="reset">처음으로</button>
  </div>
</header>
<div id="v"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ── 역할 9종 ──────────────────────────────────────────────── */
var ROLES={
 dispatch:"발령자",staff:"사택담당자",approver:"결재권자",agent:"중개사",landlord:"임대인",

  $("#v").innerHTML=landing();
  if(location.hash==="#guide"){var g=document.getElementById("guide");if(g)g.scrollIntoView({block:"start"})}
  return}
 var need=ROUTE[h];
 var page=function(c){return '<main class="wrap" id="main">'+c+"</main>"};
 if(!need){
  $("#v").innerHTML=page('<div class="notice"><span class="code">404 · NOT FOUND</span>'+
   "<h2>없는 주소입니다</h2>"+
   '<p class="lead">주소를 다시 확인해 주십시오. 이 샘플에 있는 화면은 아홉 역할의 기본 화면과 운영 어드민뿐입니다.</p>'+
   '<div class="cta"><button class="btn" onclick="go(\''+role+'\')">내 화면으로</button>'+
   '<button class="btn g" onclick="goHash(\'#/\')">첫 화면으로</button></div></div>');
  return}
 if(need!==role){
  $("#v").innerHTML=page('<div class="notice"><span class="code">403 · FORBIDDEN</span>'+
   "<h2>접근 권한이 없습니다</h2>"+
   '<p class="lead">이 화면은 <b>'+ROLES[need]+"</b> 전용입니다. 현재 역할은 <b>"+ROLES[role]+
   "</b>입니다. 주소를 직접 입력해도 역할에 없는 화면은 열리지 않습니다.</p>"+
   '<div class="cta"><button class="btn" onclick="go(\''+role+'\')">내 화면으로</button>'+
   '<button class="btn g" onclick="go(\''+need+'\')">'+ROLES[need]+"로 전환</button></div></div>");
  return}
 $("#v").innerHTML=page('<div class="ttl"><h1>'+TITLE[h]+"</h1>"+
  '<p class="who">'+ROLES[role]+" · "+PERSONA[role]+"</p></div>"+V[h](h))}

window.addEventListener("hashchange",function(){
 if(navLock){navLock=false;return}
 render()});
render();
</script>
